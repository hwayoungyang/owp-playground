  - '@owp/components@3.0.0-rc.0 || 3.0.0 || 3.0.1'
  - '@owp/core@7.0.0-rc.0 || 7.0.0 || 7.0.1'
  - '@owp/datagrid@3.1.4-rc.0 || 3.1.4 || 3.2.0 || 3.2.1 || 3.3.0 || 3.4.0 || 3.5.0'
  - '@owp/date-picker@2.0.1-rc.0 || 2.0.1 || 2.0.2'
  - '@owp/utils@1.0.0-rc.0 || 1.0.0 || 1.0.1'

allowBuilds:
  core-js-pure: false
