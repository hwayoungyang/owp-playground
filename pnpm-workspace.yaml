packages:
  - '.'

pmOnFail: download
verifyDepsBeforeRun: false

overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@1.3.0
  'vitest@*': 5.0.5

peerDependencyRules:
  allowedVersions:
    vite: 1.3.0

minimumReleaseAgeExclude:
  - '@owp/charts@4.0.6-rc.0'
  - '@owp/components@3.0.0-rc.0'
  - '@owp/core@7.0.0-rc.0'
  - '@owp/datagrid@3.1.4-rc.0'
  - '@owp/date-picker@2.0.1-rc.0'
  - '@owp/utils@1.0.0-rc.0'

allowBuilds:
  core-js-pure: false
